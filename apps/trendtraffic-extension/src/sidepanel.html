<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Booster</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="hd">
    <div class="brand"><span class="dot"></span><b>Flow Booster</b><span class="ver" id="ver"></span></div>
    <a class="tt" id="ttLink" href="https://app.trendtraffic.pro/gallery?tab=flow" target="_blank" rel="noopener">
      <span class="tt-dot" id="ttDot"></span><span id="ttState">TrendFlow</span>
    </a>
  </header>

  <main>
    <!-- Flow tab bar -->
    <section class="bar">
      <button class="btn pri" id="openFlow">Open Google&nbsp;Flow</button>
      <span class="chip off" id="flowChip">no Flow tab</span>
    </section>

    <!-- Generation settings (подписи локализует applyI18n в sidepanel.js) -->
    <section class="card">
      <div class="grid">
        <label class="fld">
          <span id="lMode">Mode</span>
          <select id="mode">
            <option value="textToVideo">Text → Video</option>
            <option value="imageToVideo">Image → Video</option>
            <option value="components">Ingredients → Video</option>
            <option value="textToImage">Text → Image</option>
            <option value="imageToImage">Image → Image</option>
          </select>
        </label>
        <label class="fld">
          <span id="lModel">Model</span>
          <select id="model">
            <option value="">Auto (current)</option>
            <option value="Veo 3.1 Fast">Veo 3.1 — Fast</option>
            <option value="Veo 3.1 Quality">Veo 3.1 — Quality</option>
            <option value="Veo 2 Fast">Veo 2 — Fast</option>
            <option value="Veo 2 Quality">Veo 2 — Quality</option>
            <option value="Nano Banana">Nano Banana (image)</option>
          </select>
        </label>
        <label class="fld">
          <span id="lAspect">Aspect</span>
          <select id="aspect">
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="1:1">1:1</option>
          </select>
        </label>
        <label class="fld">
          <span id="lCount">Per prompt</span>
          <select id="count">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </label>
        <label class="fld">
          <span id="lResolution">Resolution</span>
          <select id="resolution">
            <option value="">Preview (as shown)</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
            <option value="2k">2K</option>
            <option value="4k">4K</option>
          </select>
        </label>
        <label class="fld">
          <span id="lLength">Length (s)</span>
          <select id="length">
            <option value="">Auto</option>
            <option value="4">4s</option>
            <option value="6">6s</option>
            <option value="8">8s</option>
          </select>
        </label>
      </div>
    </section>

    <!-- Characters / references (image-driven modes) -->
    <section class="card refbox" id="refBox" hidden>
      <div class="row between">
        <span class="lbl"><span id="lChars">Characters</span> <em id="lCharsEm">(consistency)</em></span>
        <label class="mini-btn"><input type="file" id="refInput" accept="image/*" multiple hidden /><span id="lAddRef">+ add</span></label>
      </div>
      <div class="chars" id="refs"></div>
      <label class="fld">
        <span id="lAttach">Attach to prompts</span>
        <select id="charMode">
          <option value="mentioned">Only characters named in the prompt</option>
          <option value="all">All characters, on every prompt</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="useMention" /> <span id="lUseMention">Use Flow @mention (else upload as reference)</span></label>
      <label class="chk"><input type="checkbox" id="chain" /> <span id="lChain">Chain last result as reference (forces sequential)</span></label>
    </section>

    <!-- Prompts -->
    <section class="card">
      <div class="row between">
        <span class="lbl"><span id="lPrompts">Prompts</span> <em id="lPromptsEm">(one per line)</em></span>
        <span class="count-pill"><b id="promptCount">0</b> <span id="lQueued">queued</span></span>
      </div>
      <textarea id="prompts" rows="6" placeholder="A neon city street at night, cinematic…&#10;A cat surfing a giant wave, slow motion…&#10;…"></textarea>
    </section>

    <!-- Output / download -->
    <section class="card">
      <div class="grid2">
        <label class="fld"><span id="lFolder">Folder</span><input type="text" id="folder" placeholder="FlowBooster" /></label>
        <label class="fld"><span id="lPrefix">Name prefix</span><input type="text" id="prefix" placeholder="" /></label>
      </div>
      <label class="chk"><input type="checkbox" id="autoDl" checked /> <span id="lAutoDl">Auto-download results to disk</span></label>
      <label class="chk"><input type="checkbox" id="hiRes" /> <span id="lHiRes">High-res via Flow menu (true 2K/4K, slower)</span></label>
      <label class="chk" id="ttSendWrap"><input type="checkbox" id="ttSend" /> <span id="lTtSend">Also send to TrendFlow Gallery</span> <a id="ttSignin" href="https://app.trendtraffic.pro" target="_blank" rel="noopener" hidden>(sign in)</a></label>
      <div class="grid2">
        <label class="fld inline"><span id="lDelay">Delay (s)</span><input type="number" id="pace" min="4" max="600" value="30" /></label>
        <label class="fld inline"><span id="lParallel">Parallel</span><input type="number" id="concurrency" min="1" max="4" value="1" /></label>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <button class="btn pri" id="start">▶ Start</button>
      <button class="btn" id="pause" disabled>⏸ Pause</button>
      <button class="btn" id="stop" disabled>■ Stop</button>
      <button class="btn ghost" id="clear">Clear</button>
    </section>

    <!-- Queue -->
    <section class="queue" id="queue"></section>

    <!-- Log -->
    <section class="logwrap">
      <div class="row between"><span class="lbl dim" id="lLog">Log</span><button class="link" id="clearLog">clear</button></div>
      <pre class="log" id="log"></pre>
    </section>

    <footer class="foot" id="fbFoot">
      Free · no sign-in required. Results download to your computer. TrendFlow is optional.
    </footer>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
